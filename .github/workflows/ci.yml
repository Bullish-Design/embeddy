name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint / format / one-way dependency / lazy imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install workspace
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Enforce one-way dependency (chonkai must never import embeddy)
        run: |
          if grep -rnE '(^|[[:space:]])(from|import)[[:space:]]+embeddy' packages/chonkai/src; then
            echo "::error::chonkai must never import embeddy (one-way dependency violated)"
            exit 1
          fi
      - name: Lazy-import audit (extra-only deps only in entry points / lazy)
        run: python3 scripts/check_lazy_imports.py

  type:
    name: ty (strict type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install workspace
        run: uv sync
      - name: ty
        run: uv run ty check

  test:
    name: Tests (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install workspace
        run: uv sync
      - name: pytest
        run: uv run pytest

  install-matrix:
    # Phase-7 install matrix (plan §9 work item 1 / §12 M6 gate): one fresh
    # venv per extras row, install from source, assert the import surface.
    # Supersedes the M5 import-smoke job (its zero-extras contract is the
    # zero-extras row here, plus the entry-point ImportError checks).
    name: Install matrix (${{ matrix.row }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        row: [zero-extras, "embeddy[server]", "embeddy[client]", "embeddy[local]", "embeddy[qdrant]", "chonkai[docling]", "chonkai[tokenizers]"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install-matrix row (fresh venv, pip install, import checks)
        run: python3 scripts/check_install_matrix.py --rows "${{ matrix.row }}"

  benchmarks:
    # Phase-7 benchmark harness (plan §9 work item 4) — OPTIONAL per plan
    # §9: runs every push so the numbers are visible, but a timing/resource
    # regression never blocks the release gate (docs/decisions/0002).
    # benchmarks/ is OUTSIDE pytest testpaths, so the default test job
    # never runs these (the ~10s gate is untouched).
    name: Benchmarks (chunk quality + search/ingest/resource)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install workspace
        run: uv sync
      - name: Run benchmark harness
        run: uv run pytest benchmarks/ --no-cov --benchmark-min-rounds=2 --benchmark-min-time=0.001
