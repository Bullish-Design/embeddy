name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint / format / one-way dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install workspace
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Enforce one-way dependency (chonkai must never import embeddy)
        run: |
          if grep -rnE '(^|[[:space:]])(from|import)[[:space:]]+embeddy' packages/chonkai/src; then
            echo "::error::chonkai must never import embeddy (one-way dependency violated)"
            exit 1
          fi

  type:
    name: mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install workspace
        run: uv sync
      - name: mypy
        run: uv run mypy

  test:
    name: Tests (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install workspace
        run: uv sync
      - name: pytest
        run: uv run pytest

  import-smoke:
    name: Import smoke (zero extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install both packages with no extras
        run: |
          python -m pip install --quiet ./packages/chonkai
          python -m pip install --quiet ./packages/embeddy
      - name: Import check
        run: |
          python -c "import chonkai; import embeddy; print('import smoke OK')"
