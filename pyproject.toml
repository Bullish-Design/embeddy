# chonkai + embeddy workspace root (virtual workspace — no package of its own).
# Layout: IMPLEMENTATION_PLAN §2. Per-package metadata lives in
# packages/<pkg>/pyproject.toml; shared tool config (ruff/ty/pytest) lives here.

[tool.uv.workspace]
members = ["packages/chonkai", "packages/embeddy"]

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5.0,<7",
  "hypothesis>=6.100,<7",
  "ruff>=0.6,<1",
  "ty>=0.0.56,<1",
  # httpx is an embeddy extra (embeddy[client]) but a dev/test dependency for
  # the HTTPProvider wire tests (plan §11: httpx MockTransport). The library
  # itself imports httpx lazily, so zero-extras `import embeddy` stays clean.
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "eval", "packages/chonkai/tests", "packages/embeddy/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Coverage gate: raised toward the plan §11 targets (≥90% core / ≥95% chunkers)
# as the per-package unit suites land in later phases.
addopts = "-q --cov=embeddy --cov=chonkai --cov-report=term-missing --cov-fail-under=60"
markers = [
  "e2e: end-to-end keystone / full-pipeline tests (tests/e2e)",
  "integration: integration tests: real sqlite-vec/FTS5, mocked models (tests/)",
  "unit: pure-logic unit tests (per-package tests/)",
  "slow: model-touching tests (sentence-transformers, docling)",
  "gpu: optional GPU tests",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
# .scratch/ is the planning workspace (concept/plan/spikes) — intentionally not
# checked. test fixtures hold intentionally-broken/foreign-language samples
# (data, not code).
exclude = [".scratch", "packages/chonkai/tests/fixtures"]

[[tool.ty.overrides]]
# Extra-only deps (chonkai[docling], chonkai[tokenizers]) — imported lazily in
# these modules; not installed in the dev env, so the import cannot resolve.
# Ty's defaults are strict-by-default (replaces the mypy strict config).
include = ["**/docling.py", "**/tokens.py"]
rules = { unresolved-import = "ignore" }

[[tool.ty.overrides]]
# embeddy[local] (sentence-transformers) and embeddy[client] (httpx) extras —
# imported lazily inside load()/encode()/rerank(); the dev env may not have
# the extras installed, so the imports cannot resolve (the docling pattern).
include = [
  "**/providers/local.py",
  "**/providers/http.py",
  "**/providers/rerank.py",
]
rules = { unresolved-import = "ignore" }

[[tool.ty.overrides]]
# The LocalProvider image-decode tests import PIL (an optional ST dependency,
# importorskip'd at runtime) — not installed in the dev env.
include = [
  "packages/embeddy/tests/test_local_provider.py",
  "tests/slow/test_slow_multimodal.py",
]
rules = { unresolved-import = "ignore" }

[[tool.ty.overrides]]
# benchmarks/ — the LanceDB spike. lancedb + pyarrow are SPIKE-ONLY deps
# (installed manually in the dev venv, not in uv.lock); and the LanceModel
# schema declares the vector column as a runtime call `Vector(dim)` in a class
# body, which ty rejects as a type expression. Both are documented in
# benchmarks/README.md.
include = ["benchmarks/**"]
rules = { unresolved-import = "ignore", invalid-type-form = "ignore" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/chonkai/src", "packages/embeddy/src", "tests", "eval", "benchmarks"]
# .scratch/ is the planning workspace (concept/plan/spikes) — intentionally not linted.
# test fixtures hold intentionally-broken/foreign-language samples (data, not code).
exclude = [".scratch", "packages/chonkai/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
