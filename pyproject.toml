# chonkai + embeddy workspace root (virtual workspace — no package of its own).
# Layout: IMPLEMENTATION_PLAN §2. Per-package metadata lives in
# packages/<pkg>/pyproject.toml; shared tool config (ruff/mypy/pytest) lives here.

[tool.uv.workspace]
members = ["packages/chonkai", "packages/embeddy"]

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5.0,<7",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Coverage gate: raised toward the plan §11 targets (≥90% core / ≥95% chunkers)
# as the per-package unit suites land in later phases.
addopts = "-q --cov=embeddy --cov=chonkai --cov-report=term-missing --cov-fail-under=60"
markers = [
  "e2e: end-to-end keystone / full-pipeline tests (tests/e2e)",
  "integration: integration tests: real sqlite-vec/FTS5, mocked models (tests/)",
  "unit: pure-logic unit tests (per-package tests/)",
  "slow: model-touching tests (sentence-transformers, docling)",
  "gpu: optional GPU tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
mypy_path = "packages/chonkai/src:packages/embeddy/src"
packages = ["chonkai", "embeddy"]

[[tool.mypy.overrides]]
# C-extension / runtime-only deps without bundled stubs. Kept to the minimum;
# anything with real stubs must NOT be listed here (warn_unused_ignores).
module = ["sqlite_vec", "tiktoken"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/chonkai/src", "packages/embeddy/src", "tests"]
# .scratch/ is the planning workspace (concept/plan/spikes) — intentionally not linted.
exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
