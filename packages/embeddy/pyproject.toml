[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "embeddy"
version = "0.1.1"
description = "Typed, metric-honest embedding, storage, search, and serving. Consumes chonkai."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "chonkai>=0.1.0",
  "pydantic>=2.0,<3",
  "numpy>=1.26,<3",
  "sqlite-vec>=0.1.9,<0.2",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.0,<3",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "typer>=0.12"]
client = ["httpx>=0.27"]
qdrant = ["qdrant-client>=1.9"]

[project.scripts]
# The M5 CLI (plan §8): `embeddy serve|ingest|search|info`. Needs the
# `server` extra (typer); importing the console script without extras
# fails loudly, which is the documented extra contract.
embeddy = "embeddy.cli:app"

[tool.uv.sources]
# chonkai resolves to the workspace member, never to PyPI.
chonkai = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/embeddy"]
